<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDvCo1SLfT2RXPRhfK2CMzBOHQM1b_ZkA",
  authDomain: "melenium-b5be1.firebaseapp.com",
  projectId: "melenium-b5be1",
  storageBucket: "melenium-b5be1.firebasestorage.app",
  messagingSenderId: "2868066213946",
  appId: "1:2868066213946:web:6cb9dda8a012c1f3d50403"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getDeviceId() {
  let id = localStorage.getItem('device_id');
  if (!id) {
    id = 'dev_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
    localStorage.setItem('device_id', id);
  }
  return id;
}

async function checkPassword() {
  const input = document.getElementById('lockPasswordInput').value.trim().toLowerCase();
  const errorEl = document.getElementById('lockError');
  const btn = document.getElementById('lockBtn');
  
  if (!input) { errorEl.textContent = 'Введите код'; return; }
  
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>Проверка...';
  errorEl.textContent = '';
  
  try {
    const codeRef = doc(db, 'codes', input);
    const codeSnap = await getDoc(codeRef);
    
    if (!codeSnap.exists()) {
      errorEl.textContent = 'Недействительный код';
      document.getElementById('lockPasswordInput').classList.add('error');
      setTimeout(() => document.getElementById('lockPasswordInput').classList.remove('error'), 400);
      btn.disabled = false;
      btn.textContent = 'Разблокировать';
      return;
    }
    
    const codeData = codeSnap.data();
    const deviceId = getDeviceId();
    
    if (codeData.used) {
      if (codeData.deviceId === deviceId) {
        unlockDevice();
        unlockApp();
      } else {
        errorEl.textContent = 'Этот код уже использован';
        btn.disabled = false;
        btn.textContent = 'Разблокировать';
      }
      return;
    }
    
    await updateDoc(codeRef, {
      used: true,
      deviceId: deviceId,
      activatedAt: serverTimestamp()
    });
    
    unlockDevice();
    unlockApp();
    
  } catch (error) {
    console.error(error);
    errorEl.textContent = 'Ошибка сети. Проверьте интернет.';
    btn.disabled = false;
    btn.textContent = 'Разблокировать';
  }
}

function unlockDevice() { localStorage.setItem('device_unlocked', 'true'); }
function unlockApp() {
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('lockScreen').style.display = 'none';
}

window.checkPassword = checkPassword;

window.addEventListener('load', () => {
  const lockInput = document.getElementById('lockPasswordInput');
  lockInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPassword(); });
  if (localStorage.getItem('device_unlocked') === 'true') unlockApp();
});
</script>

    { num: 3, start: '11:40', end: '12:25', room: '311', subject: 'Физика', homework: null },
    { breakTime: 10, breakEnd: '12:35' },
    { num: 4, start: '12:35', end: '13:20', room: '206', subject: 'Алгебра и начала математического анализа', homework: null }
  ]
};

const gradesData = {
  'Физическая культура': [{grade:5, date:'18.09', desc:'Тест'}],
  'Информатика': [{grade:3, date:'16.09', desc:'Задачи'}],
  'Геометрия': [{grade:2, date:'16.09', desc:'Задачи'}]
};

const tasksData = {
  '2026-09-22': [
    { subject: 'Геометрия', text: 'Выполнить № 6а-8а', done: false, pending: 1 }
  ]
};

let currentWeekStart = new Date(2026, 8, 22);
let selectedDate = new Date(2026, 8, 22);
let currentGradeView = 'date';

const monthNames = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const monthNamesGen = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

function getDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

function renderCalendar() {
  document.getElementById('monthBtn').textContent = 'Сентябрь';
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(currentWeekStart); d.setDate(currentWeekStart.getDate() + i);
    let cls = 'day-number';
    if (isSameDay(d, selectedDate)) cls += ' selected';
    if (i >= 5 && !isSameDay(d, selectedDate)) cls += ' weekend';
    html += `<div class="calendar-day" onclick="selectDate(${d.getFullYear()},${d.getMonth()},${d.getDate()})"><div class="day-name">${dayNames[i]}</div><div class="${cls}">${d.getDate()}</div></div>`;
  }
  document.getElementById('calendarWeek').innerHTML = html;
}

function selectDate(y, m, d) { selectedDate = new Date(y, m, d); renderCalendar(); renderSchedule(); }
function goToday() { renderCalendar(); renderSchedule(); }
function changeWeek(delta) { currentWeekStart.setDate(currentWeekStart.getDate() + delta*7); selectedDate = new Date(currentWeekStart); renderCalendar(); renderCurrentPage(); }

function renderSchedule() {
  const schedule = scheduleData[getDateKey(selectedDate)] || [];
  const c = document.getElementById('schedule');
  if (schedule.length === 0) { c.innerHTML = `<div class="empty-day"><div class="empty-emoji">🙂</div><div class="empty-title">Нет уроков</div></div>`; return; }
  let html = '';
  schedule.forEach(item => {
    if (item.breakTime !== undefined) {
      html += `<div class="break-row"><div class="break-left"><span class="break-icon">${runIcon}</span>Перемена ${item.breakTime} мин</div><span>${item.breakEnd||''}</span></div>`;
    } else {
      let hw = item.homework 
        ? `<div class="homework-section"><span class="homework-icon">${houseIcon}</span><div><div class="homework-title">Домашнее задание</div><div class="homework-text">${item.homework}</div>${item.pending?`<div class="homework-pending ${item.pendingColor||''}">${item.pending}</div>`:''}</div></div>`
        : `<div class="homework-section"><span class="homework-icon">${houseIcon}</span><div class="homework-title">Домашнее задание не задано</div></div>`;
      html += `<div class="lesson-card"><div class="lesson-info"><span>${item.num} урок</span><span>${item.start}–${item.end}</span><span>каб.${item.room}</span></div><div class="lesson-subject">${item.subject}</div>${hw}</div>`;
    }
  });
  c.innerHTML = html;
}

function renderTasks() {
  const c = document.getElementById('tasksContent');
  const end = new Date(currentWeekStart); end.setDate(currentWeekStart.getDate()+6);
  let html = `<div class="week-nav"><button class="week-nav-btn" onclick="changeWeek(-1)">‹</button><div class="week-nav-label">${currentWeekStart.getDate()} сен – ${end.getDate()} сен</div><button class="week-nav-btn" onclick="changeWeek(1)">›</button><button class="today-btn" onclick="goToday()">Сегодня</button></div>`;
  let has = false;
  for (let i = 0; i < 7; i++) {
    const d = new Date(currentWeekStart); d.setDate(currentWeekStart.getDate()+i);
    const tasks = tasksData[getDateKey(d)] || [];
    if (tasks.length === 0) continue;
    has = true;
    html += `<div class="date-group"><div class="date-group-header"><div><div class="date-group-header-title">${d.getDate()} ${monthNamesGen[d.getMonth()].toUpperCase()}</div><div class="date-group-sub">${['вс','пн','вт','ср','чт','пт','сб'][d.getDay()]}</div></div></div>`;
    const grouped = {};
    tasks.forEach((t, idx) => { if (!grouped[t.subject]) grouped[t.subject]=[]; grouped[t.subject].push({...t, idx}); });
    Object.keys(grouped).forEach(subj => {
      html += `<div class="task-subject-name">${subj}</div>`;
      grouped[subj].forEach(t => {
        html += `<div class="task-item"><div class="task-item-checkbox ${t.done?'checked':''}" onclick="toggleTask('${getDateKey(d)}',${t.idx})"></div><div style="flex:1"><div class="task-item-text ${t.done?'done':''}">${t.text}</div>${t.pending?`<div class="task-item-pending">${t.pending} для выполнения</div>`:''}</div></div>`;
      });
    });
    html += `</div>`;
  }
  if (!has) html += `<div class="empty-day"><div class="empty-emoji"></div><div class="empty-title">Нет заданий</div></div>`;
  c.innerHTML = html;
}

function toggleTask(key, idx) { if (tasksData[key]) { tasksData[key][idx].done = !tasksData[key][idx].done; renderTasks(); } }

function renderGradesByDate() {
  const c = document.getElementById('gradesContent');
  const end = new Date(currentWeekStart); end.setDate(currentWeekStart.getDate()+6);
  let html = `<div class="week-nav"><button class="week-nav-btn" onclick="changeWeek(-1)">‹</button><div class="week-nav-label">${currentWeekStart.getDate()} сен – ${end.getDate()} сен</div><button class="week-nav-btn" onclick="changeWeek(1)">›</button><button class="today-btn" onclick="goToday()">Сегодня</button></div>`;
  const week = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(currentWeekStart); d.setDate(currentWeekStart.getDate()+i);
    const day = [];
    Object.keys(gradesData).forEach(subj => {
      gradesData[subj].forEach((g, idx) => {
        if (g.date === `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`) day.push({...g, subject: subj, idx});
      });
    });
    if (day.length) week.push({date: d, grades: day});
  }
  if (week.length === 0) html += `<div class="empty-day"><div class="empty-emoji">🙂</div><div class="empty-title">Нет оценок</div></div>`;
  else week.forEach(w => {
    const isToday = isSameDay(w.date, new Date(2026,8,22));
    html += `<div class="date-group ${isToday?'today':''}"><div class="date-group-header"><div><div class="date-group-header-title">${w.date.getDate()} ${monthNamesGen[w.date.getMonth()].toUpperCase()}</div></div></div><div class="date-group-sub">${isToday?'сегодня':''}</div>`;
    w.grades.forEach(g => {
      html += `<div class="grade-row"><div class="grade-box"><span class="grade-val">${g.grade}</span></div><div class="grade-row-info"><div class="grade-row-subject">${g.subject}</div><div class="grade-row-desc">${g.desc||''}</div></div></div>`;
    });
    html += `</div>`;
  });
  c.innerHTML = html;
}

function renderGradesBySubject() {
  const c = document.getElementById('gradesContent');
  let html = '';
  Object.keys(gradesData).sort().forEach(subj => {
    const grades = gradesData[subj];
    const avg = grades.reduce((s,g)=>s+g.grade,0)/grades.length;
    let text = '', pct = 0;
    if (avg >= 4.5) { text = 'цель достигнута'; pct = 100; }
    else if (avg >= 3.5) { text = `до 4: нужно ${Math.ceil((4*grades.length - grades.reduce((s,g)=>s+g.grade,0))/(5-4))}`; pct = ((avg-3))*100; }
    else { text = `до 3: нужно ${Math.ceil((3*grades.length - grades.reduce((s,g)=>s+g.grade,0))/(5-3))}`; pct = ((avg-2))*100; }
    pct = Math.min(100, Math.max(0, pct));
    html += `<div class="subject-card"><div class="subject-card-top"><div class="subject-name">${subj}</div><div class="subject-avg-box">${avg.toFixed(2)}</div></div><div class="subject-semester">1 полугодие</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-text ${text==='цель достигнута'?'achieved':''}">${text}</div></div>`;
  });
  c.innerHTML = html;
}

function renderCurrentPage() {
  const active = document.querySelector('.page.active');
  if (!active) return;
  if (active.id === 'pageSchedule') renderSchedule();
  else if (active.id === 'pageGrades') currentGradeView === 'date' ? renderGradesByDate() : renderGradesBySubject();
  else if (active.id === 'pageTasks') renderTasks();
}

function switchPage(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('calendarBlock').style.display = page === 'schedule' ? 'block' : 'none';
  document.getElementById('filtersBlock').style.display = page === 'schedule' ? 'flex' : 'none';
  document.getElementById('addGradeFab').style.display = page === 'grades' ? 'flex' : 'none';
  document.getElementById('segmentedControl').style.display = page === 'grades' ? 'flex' : 'none';
  document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
  btn.classList.add('active');
  renderCurrentPage();
}

function switchGradeView(view, btn) {
  currentGradeView = view;
  document.querySelectorAll('.segment-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCurrentPage();
}

function openEditModal() { document.getElementById('modalOverlay').classList.add('show'); }
function closeEditModal() { document.getElementById('modalOverlay').classList.remove('show'); }
function openNameModal() { document.getElementById('nameInput').value = document.getElementById('userName').textContent; document.getElementById('nameModalOverlay').classList.add('show'); }
function closeNameModal() { document.getElementById('nameModalOverlay').classList.remove('show'); }
function saveName() { const n = document.getElementById('nameInput').value.trim(); if (n) { document.getElementById('userName').textContent = n; closeNameModal(); } }
function openGradeModal() { document.getElementById('gradeModalContent').innerHTML = '<h3>Скоро</h3><div class="modal-actions"><button class="btn-reset" onclick="closeGradeModal()">Закрыть</button></div>'; document.getElementById('gradeModalOverlay').classList.add('show'); }
function closeGradeModal() { document.getElementById('gradeModalOverlay').classList.remove('show'); }
function resetToDefault() { closeEditModal(); }
function saveSchedule() { closeEditModal(); }
function addNewLesson() {}

renderCalendar();
renderSchedule();
</script>
</body>
</html>
